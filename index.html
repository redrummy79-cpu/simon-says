<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>simon · something is watching</title>
<style>
:root{
  --S: min(86vw, 62vh, 520px);
  --neon:#3cf6ff; --neon2:#b06bff; --alien:#9fd65a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 40%, #141a33 0%, #070914 55%, #020308 100%);
  color:#dfe7ff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;transition:opacity .6s}
#hud .row{display:flex;gap:18px;font-weight:700;letter-spacing:.12em;font-size:clamp(12px,2.6vw,15px);text-transform:uppercase}
#hud .row b{color:#fff;font-size:1.25em;margin-left:4px}
#msg{min-height:1.4em;font-size:clamp(13px,3vw,16px);color:#9fb0d8;text-align:center;transition:color .3s}
#msg.bad{color:#ff6b6b}#msg.good{color:#7dffa2}
#toolbar{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:8px}
.chip{background:rgba(20,26,50,.8);border:1px solid #2c3766;color:#cfe0ff;border-radius:999px;padding:7px 12px;font:600 12px/1 inherit;font-family:inherit;cursor:pointer;letter-spacing:.06em}
.chip:hover{border-color:var(--neon);color:#fff}
#openBtn{display:none;border-color:#4a7a2a;color:#bff58a}
#openBtn.on{display:inline-block}
#hint{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;font-size:11px;color:#4b5680;letter-spacing:.08em;max-width:52vw;transition:opacity .6s}
body.lairmode #hud, body.lairmode #hint{opacity:0;pointer-events:none}
body.lairmode #toolbar{top:calc(10px + env(safe-area-inset-top));left:140px;right:auto;bottom:auto}
body.lairmode #openBtn{display:none}

/* ---------- STAGE / SIMON ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1300px;z-index:2;padding-top:40px}
#simon{position:relative;width:var(--S);height:var(--S);transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,-0.2,.3,1.3)}
#simon.gone{visibility:hidden}
.shadow{position:absolute;inset:-2%;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 0 2px #000;transition:opacity .8s}
.panels{position:absolute;inset:0;transform-style:preserve-3d}
.panel{position:absolute;inset:0;border-radius:50%;
  clip-path:polygon(50% 50%, 28.9% -1%, 71.1% -1%);
  background:radial-gradient(circle at 50% 50%, #1b1b1d 0 55%, #121213 70%, #050505 96%, #2a2a2e 98%, #0a0a0a 100%);
  transform:rotate(var(--a));transition:transform 1.2s cubic-bezier(.7,0,.2,1), opacity 1.2s, filter .6s}
.panel::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, transparent 0 93%, var(--neon) 95%, transparent 97%),
             linear-gradient(90deg, transparent 49.6%, rgba(60,246,255,.0) 49.6% 50.4%, transparent 50.4%);
  opacity:0;transition:opacity .5s}
.pads{position:absolute;inset:4.5%;transform-style:preserve-3d}
.pad{position:absolute;width:47.6%;height:47.6%;cursor:pointer;
  transition:transform 1.1s cubic-bezier(.7,-0.15,.25,1.2), opacity .9s, filter .08s, box-shadow .08s;
  box-shadow:inset 0 -10px 22px rgba(0,0,0,.35), inset 0 6px 14px rgba(255,255,255,.18);
  filter:brightness(.82) saturate(.95)}
.pad.green{top:0;left:0;border-radius:100% 7% 7% 7%;background:radial-gradient(circle at 70% 70%,#17b54b,#0a8a35)}
.pad.red{top:0;right:0;border-radius:7% 100% 7% 7%;background:radial-gradient(circle at 30% 70%,#f2463f,#c41f22)}
.pad.yellow{bottom:0;left:0;border-radius:7% 7% 7% 100%;background:radial-gradient(circle at 70% 30%,#ffd83a,#e0b40e)}
.pad.blue{bottom:0;right:0;border-radius:7% 7% 100% 7%;background:radial-gradient(circle at 30% 30%,#2a96e8,#1468b8)}
.pad.lit{filter:brightness(1.55) saturate(1.25)}
.pad.green.lit{box-shadow:0 0 40px 8px #3dff7a,inset 0 0 30px #c9ffd9}
.pad.red.lit{box-shadow:0 0 40px 8px #ff5a5a,inset 0 0 30px #ffd0d0}
.pad.yellow.lit{box-shadow:0 0 40px 8px #fff05a,inset 0 0 30px #fffbd0}
.pad.blue.lit{box-shadow:0 0 40px 8px #5cc0ff,inset 0 0 30px #d0ecff}
.seam{position:absolute;left:50%;top:50%;background:var(--neon);box-shadow:0 0 12px var(--neon),0 0 30px var(--neon);opacity:0;transition:opacity .4s, transform .9s;pointer-events:none}
.seam.h{width:96%;height:2px;transform:translate(-50%,-50%) scaleX(.1)}
.seam.v{height:96%;width:2px;transform:translate(-50%,-50%) scaleY(.1)}
.hub{position:absolute;left:50%;top:50%;width:43%;height:43%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#2a2a2d 0%,#111113 55%,#050506 100%);
  box-shadow:0 0 0 5px #0b0b0c,0 0 0 7px #2a2a2e, inset 0 4px 10px rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12%;
  transition:transform 1.1s cubic-bezier(.6,0,.3,1), opacity 1s;transform-style:preserve-3d}
.power{width:26%;height:11%;border-radius:999px;border:none;cursor:pointer;
  background:linear-gradient(#6a6d72,#3c3f44);box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 2px 4px #000;
  display:flex;align-items:center;justify-content:center}
.power svg{width:42%;height:70%}
.power.on{background:linear-gradient(#3b8f5a,#215a37);box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 0 12px #3dff7a}
.logo{margin-top:5%;font-family:"Arial Rounded MT Bold","Arial Black","Trebuchet MS",sans-serif;font-weight:900;
  color:#f1f1f1;font-size:calc(var(--S) * .088);letter-spacing:.02em;line-height:1;text-shadow:0 2px 0 #000;transform:scaleY(.92)}
.grille{margin-top:6%;width:72%;height:34%;border-radius:50% 50% 46% 46% / 30% 30% 70% 70%;
  background:radial-gradient(circle,#000 1.1px,transparent 1.6px) 0 0/5px 5px, radial-gradient(circle at 50% 0,#2b2b2e,#151517);
  box-shadow:inset 0 2px 6px #000}
#simon.t1{animation:rumble .9s linear}
@keyframes rumble{0%,100%{transform:none}10%{transform:translate(2px,-1px) rotate(.6deg)}20%{transform:translate(-3px,1px) rotate(-.8deg)}30%{transform:translate(3px,2px) rotate(.4deg)}40%{transform:translate(-2px,-2px) rotate(-.6deg)}50%{transform:translate(2px,1px) rotate(1deg)}60%{transform:translate(-3px,0) rotate(-1deg)}70%{transform:translate(2px,-2px)}80%{transform:translate(-1px,2px)}90%{transform:translate(1px,-1px)}}
#simon.t2 .seam{opacity:1}
#simon.t2 .seam.h{transform:translate(-50%,-50%) scaleX(1)}
#simon.t2 .seam.v{transform:translate(-50%,-50%) scaleY(1)}
#simon.t2 .panel::after{opacity:1}
#simon.t2 .pad{filter:brightness(1.1) saturate(1.2)}
#simon.t2 .power{box-shadow:0 0 18px var(--neon)}
#simon.t3{transform:rotateX(18deg)}
#simon.t3 .pad.green{transform:translate(-38%,-38%) translateZ(80px) rotateX(35deg) rotateY(-45deg) rotateZ(-12deg)}
#simon.t3 .pad.red{transform:translate(38%,-38%) translateZ(80px) rotateX(35deg) rotateY(45deg) rotateZ(12deg)}
#simon.t3 .pad.yellow{transform:translate(-38%,38%) translateZ(80px) rotateX(-35deg) rotateY(-45deg) rotateZ(12deg)}
#simon.t3 .pad.blue{transform:translate(38%,38%) translateZ(80px) rotateX(-35deg) rotateY(45deg) rotateZ(-12deg)}
#simon.t3 .pad.green{box-shadow:0 0 30px #3dff7a}#simon.t3 .pad.red{box-shadow:0 0 30px #ff5a5a}
#simon.t3 .pad.yellow{box-shadow:0 0 30px #fff05a}#simon.t3 .pad.blue{box-shadow:0 0 30px #5cc0ff}
#simon.t3 .hub{transform:translate(-50%,-50%) translateZ(220px) rotateZ(360deg) scale(.55)}
#simon.t3 .seam{opacity:0}
#simon.t3 .panel{transform:rotate(var(--a)) translateY(-6%) rotateX(-25deg)}
#simon.t4{transform:rotateX(10deg) scale(1.15)}
#simon.t4 .pad.green{transform:translate(-160%,-120%) translateZ(-200px) rotateX(70deg) rotateY(-80deg);opacity:0}
#simon.t4 .pad.red{transform:translate(160%,-120%) translateZ(-200px) rotateX(70deg) rotateY(80deg);opacity:0}
#simon.t4 .pad.yellow{transform:translate(-160%,120%) translateZ(-200px) rotateX(-70deg) rotateY(-80deg);opacity:0}
#simon.t4 .pad.blue{transform:translate(160%,120%) translateZ(-200px) rotateX(-70deg) rotateY(80deg);opacity:0}
#simon.t4 .hub{transform:translate(-50%,-220%) translateZ(300px) rotateZ(720deg) scale(.2);opacity:0}
#simon.t4 .panel{transform:rotate(var(--a)) translateY(-75%) rotateX(-95deg);opacity:0}
#simon.t4 .shadow{opacity:0}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle,#e9fdff,#3cf6ff 40%,transparent 75%);opacity:0}
#flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}

/* ---------- LAIR ---------- */
#lair{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:1fr minmax(300px,380px);opacity:0;visibility:hidden;
  transform:scale(.35) rotateX(30deg);transform-origin:50% 55%;transition:opacity .9s, transform 1.1s cubic-bezier(.2,.9,.2,1.05), visibility 0s 1.1s;
  background:#03050d}
#lair.show{opacity:1;visibility:visible;transform:none;transition:opacity .9s, transform 1.1s cubic-bezier(.2,.9,.2,1.05), visibility 0s}
.scene{position:relative;overflow:hidden;min-height:0;background:#050813}
.room{position:absolute;left:0;top:0;width:1320px;height:717px;transform-origin:0 0;overflow:hidden}
.room .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.room .fg{position:absolute;left:0;top:520px;width:1320px;height:197px;background-size:1320px 717px;background-position:0 -520px;z-index:6;pointer-events:none;
  -webkit-mask-image:linear-gradient(transparent 0,#000 5px);mask-image:linear-gradient(transparent 0,#000 5px)}
.room .glowfx{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at 51% 40%,rgba(60,170,255,.10),transparent 55%)}
/* projected screen overlays */
.scr{position:absolute;left:0;top:0;width:400px;height:250px;transform-origin:0 0;overflow:hidden;z-index:2;pointer-events:none}
.scr .feed{position:absolute;inset:0;opacity:0;transition:opacity .15s}
.scr.cartoon .feed{opacity:.92}
.scr .feed svg{width:100%;height:100%;display:block}
.scr .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px);mix-blend-mode:multiply}
.scr .roll{position:absolute;left:0;right:0;height:22%;background:linear-gradient(transparent,rgba(160,230,255,.10),transparent);animation:roll 5s linear infinite;animation-delay:var(--d,0s)}
@keyframes roll{0%{top:-25%}100%{top:105%}}
.scr .static{position:absolute;inset:0;background-image:var(--noise);background-size:128px 128px;opacity:.05;mix-blend-mode:screen;animation:noise .35s steps(4) infinite}
.scr.burst .static{opacity:.85}
.scr .live{position:absolute;font:700 15px/1 monospace;color:#fff;background:rgba(200,0,0,.85);padding:3px 6px;border-radius:3px;display:flex;align-items:center;gap:5px;letter-spacing:.06em}
.scr .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blinkdot 1s steps(2) infinite}
.scr .clock{position:absolute;font:14px/1 monospace;color:#bfffd0;text-shadow:0 0 5px #0f0;background:rgba(0,0,0,.35);padding:2px 4px}
.scr.big .live{left:22px;top:52px}.scr.big .clock{right:22px;top:52px}
.scr.small .live{left:8px;top:8px;font-size:22px}.scr.small .clock{right:8px;top:10px;font-size:20px}
.scr.small .cap{position:absolute;left:8px;bottom:8px;font:20px/1 monospace;color:#d6f7ff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.4);padding:3px 5px}
@keyframes noise{0%{background-position:0 0}25%{background-position:-37px 21px}50%{background-position:53px -44px}75%{background-position:-12px 61px}100%{background-position:0 0}}
@keyframes blinkdot{50%{opacity:0}}
.q{animation:qf var(--qd,2s) infinite;animation-delay:var(--qdl,0s);opacity:.35}
@keyframes qf{0%,100%{opacity:.35}6%,16%{opacity:1}22%{opacity:.35}}
.person{animation:pbob var(--pd,2.4s) ease-in-out infinite;transform-origin:80px 100px}
@keyframes pbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-1.5deg)}}
.arm{animation:tap var(--td,.9s) ease-in-out infinite;transform-box:fill-box}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* the alien (positioned in room pixels so he sits in the painted chair) */
.alien-wrap{position:absolute;left:572px;top:168px;width:212px;height:549px;z-index:5;
  transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.alien-wrap.st-0{transform:translateY(40%)}
.alien-wrap.st-1{transform:translateY(33%) translateX(-4%) rotate(-4deg)}
.alien-wrap.st-2{transform:translateY(22%) rotate(7deg)}
.alien-wrap.st-3{transform:translateY(10%) rotate(-2deg)}
.alien-wrap.st-4{transform:none}
.alien-wrap.duck{transition:transform .22s cubic-bezier(.5,0,.9,.4)}
.shake{width:100%;height:100%}
.alien-wrap.st-0 .shake{animation:tremble .09s linear infinite}
.alien-wrap.st-1 .shake{animation:tremble .14s linear infinite}
.alien-wrap.st-2 .shake{animation:tremble .5s linear infinite}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(1.6px,-.6px)}50%{transform:translate(-1.4px,.5px)}75%{transform:translate(1px,.8px)}100%{transform:translate(0,0)}}
.shake.hop{animation:hop 1.3s cubic-bezier(.3,.7,.4,1) !important}
@keyframes hop{0%{transform:none}18%{transform:translateY(-16%) rotate(-8deg)}34%{transform:translateY(0) scale(1.05,.94)}50%{transform:translateY(-9%) rotate(8deg)}66%{transform:translateY(0) scale(1.03,.97)}80%{transform:translateY(-3%)}100%{transform:none}}
.alien{position:relative;height:100%;width:100%;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 60%}
.alien img{display:block;width:100%;height:100%;filter:brightness(.84) saturate(.92) contrast(1.05) drop-shadow(0 0 8px rgba(80,170,255,.4))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.2%) rotate(.6deg)}}
.alien.talking{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{0%{transform:translateY(-.6%) rotate(-2.2deg)}100%{transform:translateY(-1.6%) rotate(2.2deg)}}
.lid{position:absolute;top:19%;height:8.9%;border-radius:50%;transform-origin:50% 0;transition:transform .07s;
  background:radial-gradient(ellipse at 50% 30%,#93a05e,#6d7a3f 70%,#56622f);box-shadow:inset 0 -2px 2px rgba(0,0,0,.35)}
.lid.l{left:13.6%;width:25.8%;transform:scaleY(0) rotate(8deg)}
.lid.r{left:61.4%;width:25.6%;transform:scaleY(0) rotate(-8deg)}
.alien.blink .lid.l{transform:scaleY(1) rotate(8deg)}
.alien.blink .lid.r{transform:scaleY(1) rotate(-8deg)}
.mouth{position:absolute;left:43.5%;top:34.4%;width:12%;height:1.5%;border-radius:50%;background:#262a10;opacity:0;transform:scaleY(.3);transition:opacity .05s, transform .05s}
.alien.mouth-open .mouth{opacity:.85;transform:scaleY(1.5)}
.heart{position:absolute;z-index:8;font-size:34px;color:#ff6fa8;text-shadow:0 0 10px #ff6fa8;pointer-events:none;animation:heart 1.8s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--hx),-220px) scale(1.2) rotate(var(--hr))}}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:8}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(12,18,40,.95),rgba(6,9,22,.98));border-left:1px solid #26305a;
  transform:translateX(100%);transition:transform .8s cubic-bezier(.2,.9,.2,1) .2s}
#lair.open .chat{transform:none}
.chat header{padding:12px 16px 10px;border-bottom:1px solid #1d2546;position:relative}
.chat header h2{font-size:15px;letter-spacing:.18em;color:var(--alien);text-transform:uppercase;text-shadow:0 0 10px rgba(159,214,90,.5)}
.chat header p{font-size:11px;color:#6f7db0;margin-top:3px;letter-spacing:.06em}
#resetBtn{position:absolute;right:10px;top:10px;background:none;border:none;color:#3a4570;font:10px/1 inherit;font-family:inherit;cursor:pointer;letter-spacing:.08em}
#resetBtn:hover{color:#8a96c8}
.trust{display:flex;align-items:center;gap:8px;margin-top:8px;font:700 10px/1 monospace;color:#8ea0d8;letter-spacing:.1em}
.trust .bar{flex:1;height:6px;border-radius:6px;background:#141b36;overflow:hidden;box-shadow:inset 0 0 0 1px #26305a}
.trust .bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ff5a6a,#ffc85a,#9fd65a);transition:width .8s}
.trust.friend .bar i{background:linear-gradient(90deg,#ff6fa8,#9fd65a)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-user-select:text;user-select:text}
.b{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.b.al{align-self:flex-start;background:rgba(80,120,40,.22);border:1px solid rgba(159,214,90,.35);color:#e4ffcc;border-bottom-left-radius:4px;cursor:pointer}
.b.al .gl{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",monospace;color:#b9ff7a;letter-spacing:.08em;font-size:16px;text-shadow:0 0 8px rgba(159,214,90,.6);transition:font-size .4s, opacity .4s}
.b.al.done .gl{font-size:11px;opacity:.5;margin-bottom:4px}
.b.al.hidegl .gl{display:none}
.b.al .lbl{font:700 9px/1 monospace;letter-spacing:.2em;color:#7fd0ff;margin:6px 0 3px;animation:blinkdot .5s steps(2) infinite}
.b.al .en{font-family:"Courier New",monospace}
.b.al .en em{color:#a9c98a;font-style:italic}
.b.you{align-self:flex-end;background:#2a3a7a;border:1px solid #3c55b0;color:#fff;border-bottom-right-radius:4px}
.b.think{opacity:.7;font-family:monospace}
.b .cur{display:inline-block;width:7px;height:1em;background:var(--alien);vertical-align:-2px;animation:blinkdot .6s steps(2) infinite}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.sugs button{font-size:11px;padding:6px 10px}
form.in{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1d2546}
form.in input{flex:1;min-width:0;background:#0b1028;border:1px solid #2c3766;border-radius:999px;color:#fff;padding:10px 14px;font-size:16px;font-family:inherit;outline:none}
form.in input:focus{border-color:var(--alien)}
form.in button{background:linear-gradient(#7fbf3f,#4f8a1f);border:none;color:#0b1a02;font-weight:800;border-radius:999px;padding:0 16px;cursor:pointer;font-family:inherit}
form.in button:disabled{opacity:.5}

@media (max-width:760px){
  #lair{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .chat{border-left:none;border-top:1px solid #26305a;transform:translateY(100%)}
  .b{font-size:13px}
  .log{padding:10px}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="hud">
  <div class="row"><span>Score<b id="score">0</b></span><span>Best<b id="best">0</b></span></div>
  <div id="msg">Press the power button to play</div>
</div>
<div id="hint">some patterns open more than games…</div>

<div id="stage">
  <div id="simon" aria-label="Simon game">
    <div class="shadow"></div>
    <div class="panels" id="panels"></div>
    <div class="pads">
      <div class="pad green"  data-c="green"  role="button" aria-label="green"></div>
      <div class="pad red"    data-c="red"    role="button" aria-label="red"></div>
      <div class="pad yellow" data-c="yellow" role="button" aria-label="yellow"></div>
      <div class="pad blue"   data-c="blue"   role="button" aria-label="blue"></div>
    </div>
    <div class="seam h"></div><div class="seam v"></div>
    <div class="hub">
      <button class="power" id="power" aria-label="power / start">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="logo">simon</div>
      <div class="grille"></div>
    </div>
  </div>

const SECRET_CODE = ['green', 'red', 'blue', 'yellow', 'green', 'green', 'red'];

const ALIEN_NAME = 'Zeeb';            // the alien's name, shown in the chat
const INPUT_TIMEOUT_MS = 5000;        // how long the player has per press
const STORAGE = { best: 'simonAlien.best', unlocked: 'simonAlien.unlocked' };

const PADS = ['green', 'red', 'yellow', 'blue'];
const FREQ = { green: 392, red: 329.63, yellow: 261.63, blue: 196 };
const KEYMAP = { q:'green', w:'red', a:'yellow', s:'blue', arrowup:'green', arrowright:'red', arrowleft:'yellow', arrowdown:'blue', '1':'green', '2':'red', '3':'yellow', '4':'blue' };

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ------------------------------ AUDIO ------------------------------ */
let AC = null, master = null, muted = false;
function audio(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur = .3, type = 'square', vol = .14, when = 0){
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = 2600;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.setValueAtTime(vol, t + Math.max(.02, dur - .05)); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function sweep(f0, f1, dur, type = 'sawtooth', vol = .08, when = 0, lp = 1400){
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  f.type = 'lowpass'; f.frequency.value = lp; f.Q.value = 6;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.setValueAtTime(vol, t + dur - .08); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
let noiseBuf = null;
function noise(dur = .15, freq = 1200, vol = .3, when = 0, q = 2){
  const a = audio(); if (!a || muted) return;
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const t = a.currentTime + when, s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
}
const sfx = {

  clank(when = 0){ noise(.18, 380, .55, when, 1.5); noise(.08, 2400, .25, when, 4); tone(90, .12, 'square', .1, when); },

  hiss(when = 0){ noise(.9, 5000, .12, when, .7); },
  powerUp(){ [261.63, 329.63, 392, 523.25].forEach((f, i) => tone(f, .12, 'square', .1, i * .07)); },
  chime(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .5, 'triangle', .1, i * .09)); },
  blip(){ tone(500 + Math.random()*600, .045, 'square', .045); }
};

(function stars(){
  const c = $('#stars'), x = c.getContext('2d'); let pts = [];
  function size(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    pts = Array.from({length: 160}, () => ({x: Math.random(), y: Math.random(), r: Math.random()*1.4 + .2, p: Math.random()*6.28})); }
  size(); addEventListener('resize', size);
  (function draw(t){ x.clearRect(0,0,c.width,c.height);
    for (const s of pts){ x.globalAlpha = .35 + .35*Math.sin(t/900 + s.p); x.fillStyle = '#cfe0ff';
      x.beginPath(); x.arc(s.x*c.width, s.y*c.height, s.r*devicePixelRatio, 0, 6.28); x.fill(); }
    requestAnimationFrame(draw); })(0);
})();

const panelsEl = $('#panels');
for (let i = 0; i < 8; i++){ const p = document.createElement('div'); p.className = 'panel'; p.style.setProperty('--a', (i*45) + 'deg'); p.style.transitionDelay = (i*40) + 'ms'; panelsEl.appendChild(p); }
const padEl = {}; document.querySelectorAll('.pad').forEach(p => padEl[p.dataset.c] = p);
const simonEl = $('#simon'), powerEl = $('#power'), msgEl = $('#msg');

function say(t, cls = ''){ msgEl.textContent = t; msgEl.className = cls; }
function light(c, ms){ padEl[c].classList.add('lit'); setTimeout(() => padEl[c].classList.remove('lit'), ms); }

/* ---------------------------- GAME LOGIC ---------------------------- */
// state: 'idle' (free play / secret entry), 'busy' (Simon playing), 'input' (player's turn), 'transforming', 'open'
const game = { state: 'idle', seq: [], idx: 0, score: 0, best: +store.get(STORAGE.best, 0), run: 0, timer: null, idleBuf: [] };
$('#best').textContent = game.best;
window.__simon = game; // handy for debugging / tests

function stepTiming(){ const n = game.seq.length; return { on: Math.max(170, 480 - n*22), gap: Math.max(60, 140 - n*5) }; }

async function startGame(){
  const run = ++game.run;
  game.seq = []; game.score = 0; $('#score').textContent = 0; game.idleBuf = [];
  powerEl.classList.add('on'); say('Watch closely…'); sfx.powerUp();
  game.state = 'busy'; await sleep(900); if (run !== game.run) return;
  nextRound(run);
}
async function nextRound(run){
  game.seq.push(PADS[Math.floor(Math.random()*4)]);
  game.state = 'busy'; say('Round ' + game.seq.length);
  await sleep(450);
  const { on, gap } = stepTiming();
  for (const c of game.seq){
    if (run !== game.run) return;
    light(c, on); tone(FREQ[c], on/1000);
    await sleep(on + gap);
  }
  if (run !== game.run) return;
  game.state = 'input'; game.idx = 0; say('Your turn'); armTimeout();
}
function armTimeout(){ clearTimeout(game.timer); game.timer = setTimeout(() => { if (game.state === 'input') gameOver('Too slow!'); }, INPUT_TIMEOUT_MS); }
function stopGame(){ game.run++; clearTimeout(game.timer); game.state = 'idle'; powerEl.classList.remove('on'); say('Game stopped. Press power to play'); game.idleBuf = []; }
async function gameOver(why = 'Wrong!'){
  game.run++; clearTimeout(game.timer); game.state = 'busy';
  sfx.buzz(); PADS.forEach(c => light(c, 700));
  const s = game.score;
  if (s > game.best){ game.best = s; store.set(STORAGE.best, s); $('#best').textContent = s; }
  say(`${why} Game over — you reached ${s}. Press power to play again`, 'bad');
  await sleep(900);
  game.state = 'idle'; powerEl.classList.remove('on'); game.idleBuf = [];
}

function padPress(c){
  if (game.state === 'busy' || game.state === 'transforming' || game.state === 'open') return;
  audio();
  light(c, 230); tone(FREQ[c], .26);
  if (game.state === 'idle'){
    game.idleBuf.push(c); if (game.idleBuf.length > SECRET_CODE.length) game.idleBuf.shift();
    if (game.idleBuf.length === SECRET_CODE.length && game.idleBuf.every((v, i) => v === SECRET_CODE[i])){ game.idleBuf = []; transformOpen(); }
    return;
  }
  if (game.state === 'input'){
    if (c !== game.seq[game.idx]) return gameOver('Wrong!');
    game.idx++; armTimeout();
    if (game.idx === game.seq.length){
      clearTimeout(game.timer); game.score = game.seq.length; $('#score').textContent = game.score;
      say('Nice!', 'good'); game.state = 'busy'; const run = game.run;
      setTimeout(() => { if (run === game.run) nextRound(run); }, 750);
    }
  }
}
document.querySelectorAll('.pad').forEach(p => p.addEventListener('pointerdown', e => { e.preventDefault(); padPress(p.dataset.c); }));
powerEl.addEventListener('click', () => {
  audio();
  if (game.state === 'idle') startGame();
  else if (game.state === 'busy' || game.state === 'input') stopGame();
});
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (KEYMAP[k] && !e.repeat){ e.preventDefault(); padPress(KEYMAP[k]); }
  else if ((k === ' ' || k === 'enter') && game.state !== 'open' && game.state !== 'transforming'){ e.preventDefault(); powerEl.click(); }
});
$('#muteBtn').addEventListener('click', () => { muted = !muted; $('#muteBtn').textContent = muted ? '🔇 Muted' : '🔊 Sound'; });

/* --------------------------- TRANSFORMATION --------------------------- */
const lair = $('#lair');
async function transformOpen(){
  if (game.state === 'transforming' || game.state === 'open') return;
  game.state = 'transforming'; game.run++; clearTimeout(game.timer);
  say('…what was that?', 'good');
  document.body.classList.add('lairmode');
  // 1: code echo + rumble
  for (const [i, c] of SECRET_CODE.entries()) setTimeout(() => { light(c, 90); tone(FREQ[c] * 2, .09, 'square', .1); }, i * 85);
  await sleep(SECRET_CODE.length * 85 + 150);
  simonEl.classList.add('t1'); sfx.servo(.9, 0, true); noise(.9, 120, .25, 0, .6);
  await sleep(900);
  // 2: neon seams ignite
  simonEl.classList.add('t2'); sfx.clank(); sfx.clank(.22); sfx.clank(.44); sfx.hiss(.5);
  await sleep(900);
  // 3: quadrants unlock and swing out, hub rises
  simonEl.classList.add('t3'); sfx.servo(1.1, 0, true); sfx.clank(1.0);
  await sleep(1150);
  // 4: panels unfold, control center revealed
  simonEl.classList.add('t4'); sfx.servo(1.0, 0, false); sfx.hiss(.2); sfx.clank(.6);
  setTimeout(() => { $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go'); sfx.chime(); lair.classList.add('show'); lair.setAttribute('aria-hidden', 'false'); }, 450);
  await sleep(1500);
  simonEl.classList.add('gone'); lair.classList.add('open');
  game.state = 'open'; store.set(STORAGE.unlocked, '1'); $('#openBtn').classList.add('on');
  onLairOpened();
}
async function transformClose(){
  if (game.state !== 'open') return;
  game.state = 'transforming';
  lair.classList.remove('open'); sfx.servo(.8, 0, false);
  await sleep(500);
  lair.classList.remove('show'); lair.setAttribute('aria-hidden', 'true'); simonEl.classList.remove('gone');
  sfx.servo(1.0, .1, true); sfx.clank(.9);
  await sleep(200); simonEl.classList.remove('t4');
  await sleep(1200); simonEl.classList.remove('t3'); sfx.clank(.6); sfx.clank(.9);
  await sleep(1100); simonEl.classList.remove('t2', 't1'); sfx.hiss(); sfx.powerUp();
  document.body.classList.remove('lairmode');
  await sleep(400);
  game.state = 'idle'; game.idleBuf = []; powerEl.classList.remove('on'); say('Simon is just a game… right? Press power to play');
}
$('#closeBtn').addEventListener('click', transformClose);
$('#openBtn').addEventListener('click', () => { audio(); if (game.state === 'busy' || game.state === 'input') stopGame(); transformOpen(); });
if (store.get(STORAGE.unlocked, '') === '1') $('#openBtn').classList.add('on');

const ROOM_W = 1320, ROOM_H = 717, CHAIR_X = 678;
const sceneEl = $('#scene'), roomEl = $('#room');
$('#roomBg').src = ROOM_SRC; $('#roomFg').style.backgroundImage = `url(${ROOM_SRC})`;
function layoutRoom(){
  const W = sceneEl.clientWidth, H = sceneEl.clientHeight; if (!W || !H) return;
  const s = Math.max(W / ROOM_W, H / ROOM_H);              // cover the scene
  let x = W / 2 - CHAIR_X * s;                              // keep the chair centred
  x = Math.min(0, Math.max(W - ROOM_W * s, x));
  const y = (H - ROOM_H * s) / 2;
  roomEl.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
addEventListener('resize', layoutRoom);

/* map a w×h box onto a painted screen quad (homography → CSS matrix3d) */
function quadMatrix(w, h, q){
  const src = [[0,0],[w,0],[w,h],[0,h]], A = [], B = [];
  for (let i = 0; i < 4; i++){
    const [x, y] = src[i], [u, v] = q[i];
    A.push([x, y, 1, 0, 0, 0, -x*u, -y*u]); B.push(u);
    A.push([0, 0, 0, x, y, 1, -x*v, -y*v]); B.push(v);
  }
  for (let c = 0; c < 8; c++){                      // gaussian elimination
    let p = c; for (let r = c+1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [B[c], B[p]] = [B[p], B[c]];
    for (let r = 0; r < 8; r++){ if (r === c) continue; const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; B[r] -= f * B[c]; }
  }
  const [a, b, c, d, e, f, g, hh] = B.map((v, i) => v / A[i][i]);
  return `matrix3d(${a},${d},0,${g},${b},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}

const toGlyphs = s => s.replace(/[a-z]/gi, c => GLYPHS[(c.toLowerCase().charCodeAt(0) - 97) % GLYPHS.length]);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const fmt = s => esc(s).replace(/\*([^*]+)\*/g, '<em>*$1*</em>');
function bubble(cls, text = ''){ const b = document.createElement('div'); b.className = 'b ' + cls; b.textContent = text; logEl.appendChild(b); logEl.scrollTop = logEl.scrollHeight; return b; }
let speaking = Promise.resolve();
/* alienSpeak: types the line in alien script with the gibberish voice, then "translates" it to English */
function alienSpeak(text){
  speaking = speaking.then(async () => {
    chatHistory.push({ role: 'alien', text });
    const scared = zeeb.stage < 3, glyphText = toGlyphs(text);
    const b = bubble('al'); b.title = 'tap to show/hide the original Zeebish';
    b.onclick = () => b.classList.toggle('hidegl');
    const gl = document.createElement('div'); gl.className = 'gl'; const cur = document.createElement('span'); cur.className = 'cur';
    b.append(gl, cur);
    alienEl.classList.add('talking');
    const per = Math.max(14, Math.min(34, 3800 / text.length)) * (scared ? .85 : 1);
    let letters = 0;
    for (let i = 0; i < glyphText.length; i++){
      gl.textContent += glyphText[i];
      if (/[a-z]/i.test(text[i])){
        if (letters % 3 === 0){
          const dur = per * 3 * .0009 + (scared ? .02 : .04);
          const rise = /\?/.test(text.slice(i, i + 12)) ? 3 : 0;
          voiceSyllable(text[i], dur, { scared, rise });
          alienEl.classList.add('mouth-open'); setTimeout(() => alienEl.classList.remove('mouth-open'), dur * 650);
        }
        letters++;
      } else letters = 0;
      logEl.scrollTop = logEl.scrollHeight;
      await sleep(/[.!?…\n]/.test(text[i]) ? per * 5 : /,/.test(text[i]) ? per * 2.5 : per);
    }
    cur.remove(); alienEl.classList.remove('talking', 'mouth-open');
    // translation phase
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = '⟁ TRANSLATING ZEEBISH…';
    const en = document.createElement('div'); en.className = 'en';
    b.append(lbl, en); b.classList.add('done');
    sweep(1800, 600, .25, 'sine', .03, 0, 6000);
    const N = text.length, frames = Math.max(16, Math.min(40, N / 3));
    for (let f = 1; f <= frames; f++){
      const k = Math.floor(N * f / frames);
      en.textContent = text.slice(0, k) + text.slice(k).replace(/[^\s]/g, () => GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
      logEl.scrollTop = logEl.scrollHeight;
      await sleep(28);
    }
    en.innerHTML = fmt(text); lbl.remove(); logEl.scrollTop = logEl.scrollHeight;
  });
  return speaking;
}
async function send(text){
  text = (text || '').trim(); if (!text) return;
  bubble('you', text); chatHistory.push({ role: 'user', text });
  inEl.value = ''; sendBtn.disabled = true;
  const typing = bubble('al think', zeeb.stage < 3 ? '*rustle rustle*' : '· · ·');
  const prev = zeeb.stage;
  let reply;
  try{ reply = await getAlienReply(text, { trust: zeeb.trust, stage: zeeb.stage, befriended: zeeb.befriended, name: zeeb.name, history: chatHistory.slice(-12) }); }
  catch(e){ reply = { text: "…static… the signal broke. Try again, Earthling." }; }
  typing.remove();
  if (!zeeb.befriended && typeof reply.trustDelta === 'number'){
    zeeb.trust = Math.max(0, Math.min(100, zeeb.trust + reply.trustDelta));
    const s = stageFor(zeeb.trust);
    if (s === 4) befriend();
    else { if (s < prev){ squeak(); setStage(s, { fast: true }); } else setStage(s); }
  }
  await alienSpeak(reply.text);
  sendBtn.disabled = false;
}
form.addEventListener('submit', e => { e.preventDefault(); audio(); send(inEl.value); });
const SUGGEST = {
  0: [ "It's okay, I'm a friend", "I won't hurt you", "Hi little guy 👋", "Don't be scared" ],
  1: [ "I come in peace ☮", "You're safe with me", "You have really cool eyes", "My name is Earthling" ],
  2: [ "I'm one of the chosen", "I just want to talk", "I trust you", "Want to be friends?" ],
  3: [ "Come sit in your chair, it's safe", "We're friends now 💚", "I love your control room" ],
  4: [ "Teach me gnosis", "Who are you?", "Share ancient knowledge", "What is Simon really?" ],
};
function renderSuggestions(){
  const host = $('#sugs'); host.innerHTML = '';
  SUGGEST[zeeb.stage].forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = s;
    b.onclick = () => { if (!sendBtn.disabled) send(s); }; host.appendChild(b); });
}

/* called by transformOpen() once the control room is revealed */
async function onLairOpened(){
  layoutRoom();
  if (zeeb.befriended){
    zeeb.trust = 100; setStage(4);
    if (!greeted){ greeted = true; await sleep(500); alienSpeak(friendGreeting()); }
    return;
  }
  // not befriended yet: he's caught sitting in his chair… then panics and ducks
  zeeb.trust = 0; setStage(4); $('#trustStage').textContent = '?';
  await sleep(700);
  squeak(); setStage(0, { fast: true });
  await sleep(400);
  alienSpeak(pick(SCARED.intro));
}
setStage(zeeb.befriended ? 4 : 0); layoutRoom();
</script>
